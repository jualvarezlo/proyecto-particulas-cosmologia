<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B0 · Beat 01 — 100.000 Millones de Neutrinos por Segundo (Motion Canvas + Remotion + SVG Draw-On)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #F4EFE6;
      --ink-charcoal: #1D1E2C;
      --cyan-electric: #00B4D8;
      --amber-solar: #F77F00;
      --sticker-white: #FDFBF7;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #12131C;
      color: #F4EFE6;
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }
    .player-shell {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .canvas-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg-cream);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Inline SVG overlay (svg-animation skill: pathLength="1" stroke-dashoffset draw-on) */
    svg.vector-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }
    .draw-path {
      fill: none;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      vector-effect: non-scaling-stroke;
    }
    .controls-bar {
      background: #1D1E2C;
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: 6px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--cyan-electric);
      color: #12131C;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .btn:hover {
      background: #22C9EC;
      transform: translateY(-1px);
    }
    .btn.secondary {
      background: rgba(244, 239, 230, 0.12);
      color: #F4EFE6;
      border: 1px solid rgba(244, 239, 230, 0.25);
    }
    .btn.secondary:hover {
      background: rgba(244, 239, 230, 0.2);
    }
    .scrubber-wrap {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--cyan-electric);
      cursor: pointer;
    }
    .time-readout {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: #00B4D8;
      min-width: 195px;
      text-align: right;
    }
    .meta-footer {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 11px;
      color: rgba(244, 239, 230, 0.6);
      padding: 0 4px;
    }
    /* Modo captura headless: fija 1920x1080 exactos sin bordes ni UI */
    body.capture-mode {
      padding: 0;
      margin: 0;
      background: #F4EFE6;
      overflow: hidden;
    }
    body.capture-mode .player-shell {
      max-width: none;
      width: 1920px;
      height: 1080px;
      gap: 0;
    }
    body.capture-mode .canvas-stage {
      width: 1920px;
      height: 1080px;
      border-radius: 0;
      box-shadow: none;
    }
    body.capture-mode .controls-bar,
    body.capture-mode .meta-footer {
      display: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="player-shell">
    <div class="canvas-stage" id="stageContainer">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <!-- Capa SVG vectorial sincronizada (skill: svg-animation con pathLength="1" y stroke-dashoffset) -->
      <svg id="vectorOverlay" class="vector-overlay" viewBox="0 0 1920 1080" aria-label="Cotas técnicas y trayectorias vectoriales de neutrinos">
        <defs>
          <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#00B4D8" />
          </marker>
          <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
          </marker>
        </defs>
        <g id="svgCameraGroup">
          <!-- Arco de trayectoria solar-terrestre con draw-on progresivo (pathLength="1") -->
          <path id="svgSolarToThumbArc" class="draw-path" pathLength="1"
                d="M 215 245 C 520 310, 840 395, 1095 468"
                stroke="#00B4D8" stroke-width="2.4" marker-end="url(#arrowCyan)" />
          <!-- Cota dimensional superior del haz -->
          <path id="svgDimensionLine" class="draw-path" pathLength="1"
                d="M 235 170 L 1145 398"
                stroke="#1D1E2C" stroke-width="1.5" stroke-dasharray="6 6" />
          <!-- Anillo exterior de escaneo sobre la uña -->
          <circle id="svgThumbScanRing" class="draw-path" pathLength="1"
                  cx="1155" cy="485" r="88"
                  stroke="#F77F00" stroke-width="2.2" />
        </g>
      </svg>
    </div>
    <div class="controls-bar">
      <button id="playBtn" class="btn">▶ Play</button>
      <button id="restartBtn" class="btn secondary">↺ Reiniciar</button>
      <div class="scrubber-wrap">
        <input id="scrubber" type="range" min="0" max="11" step="0.01" value="0" />
        <div id="timeReadout" class="time-readout">00.00s / 11.00s [F:000]</div>
      </div>
    </div>
    <div class="meta-footer">
      <span>SKILLS: MOTION-CANVAS (SIGNALS/CAMERA) · REMOTION (INTERPOLATE/SEQUENCE) · SVG-ANIMATION (STROKE DRAW-ON)</span>
      <span>1920×1080 · 30/60 FPS DETERMINISTA · VOZ: JUAN ALVAREZ</span>
    </div>
  </div>

  <!-- Audio de locución sincronizado -->
  <audio id="voAudio" preload="auto" src="../locucion/takes/B0_cold_open_JuanAlvarez/beat_01.wav"></audio>

  <script>
    // =========================================================================
    // 1. PRIMITIVAS DE LAS 3 SKILLS: MOTION-CANVAS + REMOTION + SVG-ANIMATION
    // =========================================================================
    const DURATION = 11.0;
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS; // 330 fotogramas
    const W = 1920;
    const H = 1080;

    // --- Motion Canvas Math & Easing Utilities (@motion-canvas/core) ---
    function clamp(min, max, value) {
      return Math.max(min, Math.min(max, value));
    }
    function map(from, to, value) {
      return from + (to - from) * value;
    }
    function remap(fromIn, toIn, fromOut, toOut, value) {
      const norm = (value - fromIn) / (toIn - fromIn);
      return map(fromOut, toOut, norm);
    }
    function clampRemap(fromIn, toIn, fromOut, toOut, value) {
      const clamped = clamp(0, 1, (value - fromIn) / (toIn - fromIn));
      return map(fromOut, toOut, clamped);
    }

    // Curvas de Easing de Motion Canvas (references/TWEENING.md)
    const Easing = {
      linear: (t) => clamp(0, 1, t),
      easeOutCubic: (t) => {
        const x = clamp(0, 1, t);
        return 1 - Math.pow(1 - x, 3);
      },
      easeInOutCubic: (t) => {
        const x = clamp(0, 1, t);
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      },
      easeOutExpo: (t) => {
        const x = clamp(0, 1, t);
        return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
      },
      easeOutQuart: (t) => {
        const x = clamp(0, 1, t);
        return 1 - Math.pow(1 - x, 4);
      },
      easeOutBack: (t) => {
        const x = clamp(0, 1, t);
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }
    };

    // Sistema de Señales Reactivas de Motion Canvas (createSignal)
    function createSignal(initialValue) {
      let val = initialValue;
      const signalFn = function(newVal) {
        if (arguments.length === 0) {
          return typeof val === 'function' ? val() : val;
        }
        val = newVal;
        return val;
      };
      return signalFn;
    }

    // --- Remotion Deterministic Interpolation & Sequence Primitives ---
    function interpolate(input, inputRange, outputRange, options = {}) {
      const {
        extrapolateLeft = 'clamp',
        extrapolateRight = 'clamp',
        easing = Easing.linear
      } = options;
      const [inMin, inMax] = inputRange;
      const [outMin, outMax] = outputRange;
      let rawT = (input - inMin) / (inMax - inMin);
      if (extrapolateLeft === 'clamp' && rawT < 0) rawT = 0;
      if (extrapolateRight === 'clamp' && rawT > 1) rawT = 1;
      const easedT = easing(clamp(0, 1, rawT));
      return map(outMin, outMax, easedT);
    }

    function getSequenceProgress(timeInSeconds, fromSecond, durationInSeconds) {
      return clamp(0, 1, (timeInSeconds - fromSecond) / durationInSeconds);
    }

    // --- SVG Animation Stroke Draw-On Helper (svg-animation skill) ---
    // Simula pathLength="1", stroke-dasharray="1", stroke-dashoffset = 1 - progress en Canvas 2D y SVG DOM
    function strokeDrawOnCanvas(ctx, totalLength, progress, drawPathCallback, baseDash = null) {
      const p = clamp(0, 1, progress);
      if (p <= 0.001) return;
      ctx.save();
      if (baseDash && p >= 0.999) {
        ctx.setLineDash(baseDash);
        ctx.lineDashOffset = 0;
      } else {
        ctx.setLineDash([totalLength]);
        ctx.lineDashOffset = totalLength * (1 - p);
      }
      drawPathCallback(ctx);
      ctx.stroke();
      ctx.restore();
    }

    // =========================================================================
    // 2. PALETA DE DIRECCIÓN DE ARTE (VOX EXPLAINER + QUANTUM FRACTURE)
    // =========================================================================
    const PALETTE = {
      cream: '#F4EFE6',
      creamDark: '#E7DFCF',
      creamCard: '#FAF6EE',
      charcoal: '#1D1E2C',
      charcoalSoft: 'rgba(29, 30, 44, 0.72)',
      charcoalMuted: 'rgba(29, 30, 44, 0.42)',
      cyan: '#00B4D8',
      cyanBright: '#48CAE4',
      cyanDeep: '#0077B6',
      amber: '#F77F00',
      amberBright: '#FCBF49',
      stickerWhite: '#FDFBF7',
      washiCream: 'rgba(238, 224, 192, 0.78)',
      washiAmber: 'rgba(247, 127, 0, 0.35)',
      skinPaper: '#EFE3D0',
      skinShadow: '#DFCBB0',
      nailBed: '#F7EDE2'
    };

    // Señales reactivas de escena (Motion Canvas pattern)
    const timeSignal = createSignal(0);
    const frameSignal = createSignal(() => Math.round(timeSignal() * FPS));
    const cameraZoomSignal = createSignal(() =>
      interpolate(timeSignal(), [0, DURATION], [1.0, 1.045], { easing: Easing.easeInOutCubic })
    );
    const neutrinoCountSignal = createSignal(() =>
      Math.round(interpolate(timeSignal(), [1.8, 3.6], [0, 100000], { easing: Easing.easeOutExpo }))
    );

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('capture') === '1' || urlParams.get('t') !== null) {
      if (urlParams.get('capture') === '1') {
        document.body.classList.add('capture-mode');
      }
    }

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Referencias SVG DOM (para sincronizar stroke-dashoffset en la capa <svg>)
    const svgCameraGroup = document.getElementById('svgCameraGroup');
    const svgSolarToThumbArc = document.getElementById('svgSolarToThumbArc');
    const svgDimensionLine = document.getElementById('svgDimensionLine');
    const svgThumbScanRing = document.getElementById('svgThumbScanRing');

    function seededRandom(seed) {
      let s = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
      return s - Math.floor(s);
    }

    // =========================================================================
    // 3. TEXTURA PROCEDURAL DE PAPEL CREMA ENVEJECIDO (#F4EFE6)
    // =========================================================================
    const paperCanvas = document.createElement('canvas');
    paperCanvas.width = W;
    paperCanvas.height = H;
    const paperCtx = paperCanvas.getContext('2d');

    function buildPaperTexture() {
      paperCtx.fillStyle = PALETTE.cream;
      paperCtx.fillRect(0, 0, W, H);

      const imgData = paperCtx.getImageData(0, 0, W, H);
      const data = imgData.data;
      let seed = 1337;
      for (let i = 0; i < data.length; i += 4) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        const n = ((seed >>> 24) & 0xff) - 128;
        const grain = n * 0.055;
        data[i] = clamp(0, 255, 244 + grain);
        data[i + 1] = clamp(0, 255, 239 + grain);
        data[i + 2] = clamp(0, 255, 230 + grain * 1.1);
        data[i + 3] = 255;
      }
      paperCtx.putImageData(imgData, 0, 0);

      paperCtx.save();
      for (let i = 0; i < 420; i++) {
        const x = seededRandom(i * 3.1) * W;
        const y = seededRandom(i * 7.3) * H;
        const len = 8 + seededRandom(i * 11.7) * 26;
        const ang = seededRandom(i * 19.3) * Math.PI * 2;
        paperCtx.strokeStyle = i % 2 === 0 ? 'rgba(29, 30, 44, 0.025)' : 'rgba(180, 155, 115, 0.045)';
        paperCtx.lineWidth = 0.8;
        paperCtx.beginPath();
        paperCtx.moveTo(x, y);
        paperCtx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        paperCtx.stroke();
      }

      const grad = paperCtx.createRadialGradient(W * 0.5, H * 0.5, H * 0.35, W * 0.5, H * 0.5, W * 0.68);
      grad.addColorStop(0, 'rgba(244, 239, 230, 0)');
      grad.addColorStop(1, 'rgba(185, 172, 148, 0.34)');
      paperCtx.fillStyle = grad;
      paperCtx.fillRect(0, 0, W, H);
      paperCtx.restore();
    }
    buildPaperTexture();

    // =========================================================================
    // 4. SISTEMA DE PARTÍCULAS Y PAQUETES DE ONDA CUÁNTICOS DETERMINISTAS
    // =========================================================================
    const NEUTRINO_PARTICLES = [];
    const NUM_PARTICLES = 280;
    for (let i = 0; i < NUM_PARTICLES; i++) {
      const layerType = i % 5 === 0 ? 'wavepacket' : (i % 3 === 0 ? 'halftoneLarge' : 'halftoneDot');
      NEUTRINO_PARTICLES.push({
        id: i,
        offsetPhase: seededRandom(i * 1.13),
        speed: 0.24 + seededRandom(i * 2.71) * 0.22,
        lateralSpread: (seededRandom(i * 4.09) - 0.5) * 2.0,
        radius: layerType === 'halftoneLarge'
          ? 3.8 + seededRandom(i * 5.3) * 3.4
          : 1.8 + seededRandom(i * 6.7) * 2.4,
        type: layerType,
        freq: 3.0 + seededRandom(i * 8.1) * 3.5,
        amberAccent: seededRandom(i * 13.7) > 0.86
      });
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawWashiTape(ctx, cx, cy, width, height, angleDeg, tint = PALETTE.washiCream) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((angleDeg * Math.PI) / 180);

      const hw = width / 2;
      const hh = height / 2;

      ctx.shadowColor = 'rgba(29, 30, 44, 0.12)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      ctx.beginPath();
      ctx.moveTo(-hw, -hh);
      ctx.lineTo(hw, -hh);
      for (let y = -hh; y <= hh; y += 5) {
        const zig = ((Math.abs(Math.round(y)) % 10) === 0 ? 3 : -2);
        ctx.lineTo(hw + zig, y);
      }
      ctx.lineTo(-hw, hh);
      for (let y = hh; y >= -hh; y -= 5) {
        const zig = ((Math.abs(Math.round(y)) % 10) === 0 ? -3 : 2);
        ctx.lineTo(-hw + zig, y);
      }
      ctx.closePath();

      ctx.fillStyle = tint;
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(29, 30, 44, 0.08)';
      ctx.lineWidth = 1;
      for (let x = -hw + 8; x < hw - 4; x += 9) {
        ctx.beginPath();
        ctx.moveTo(x, -hh + 2);
        ctx.lineTo(x - 6, hh - 2);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.strokeRect(-hw + 2, -hh + 1.5, width - 4, height - 3);

      ctx.restore();
    }

    function drawHalftoneCircle(ctx, cx, cy, maxR, dotSpacing, color, maxDotR = 3.2) {
      ctx.save();
      ctx.fillStyle = color;
      for (let x = cx - maxR; x <= cx + maxR; x += dotSpacing) {
        for (let y = cy - maxR; y <= cy + maxR; y += dotSpacing) {
          const dist = Math.hypot(x - cx, y - cy);
          if (dist < maxR) {
            const factor = 1 - dist / maxR;
            const r = maxDotR * Math.pow(factor, 0.75);
            if (r > 0.4) {
              ctx.beginPath();
              ctx.arc(x, y, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }
      ctx.restore();
    }

    // =========================================================================
    // CAPA 0: CUADRÍCULA TÉCNICA Y COTAS CON TRAZADO PROGRESIVO (SVG DRAW-ON)
    // =========================================================================
    function drawBlueprintGridAndMarks(ctx, t, parallaxX, parallaxY) {
      ctx.save();
      ctx.translate(parallaxX, parallaxY);

      const gridAlpha = interpolate(t, [0, 0.6], [0, 1], { easing: Easing.easeOutCubic });

      ctx.strokeStyle = `rgba(0, 180, 216, ${0.11 * gridAlpha})`;
      ctx.lineWidth = 1;
      const minorStep = 24;
      ctx.beginPath();
      for (let x = -48; x <= W + 48; x += minorStep) {
        ctx.moveTo(x, -48);
        ctx.lineTo(x, H + 48);
      }
      for (let y = -48; y <= H + 48; y += minorStep) {
        ctx.moveTo(-48, y);
        ctx.lineTo(W + 48, y);
      }
      ctx.stroke();

      // Cuadrícula mayor con efecto Motion Canvas Grid start/end draw-on
      const majorDraw = interpolate(t, [0.0, 0.9], [0, 1], { easing: Easing.easeOutQuart });
      ctx.strokeStyle = `rgba(0, 180, 216, ${0.22 * gridAlpha})`;
      ctx.lineWidth = 1.4;
      const majorStep = 120;
      ctx.beginPath();
      for (let x = 0; x <= W; x += majorStep) {
        ctx.moveTo(x, -48);
        ctx.lineTo(x, map(-48, H + 48, majorDraw));
      }
      for (let y = 0; y <= H; y += majorStep) {
        ctx.moveTo(-48, y);
        ctx.lineTo(map(-48, W + 48, majorDraw), y);
      }
      ctx.stroke();

      ctx.strokeStyle = `rgba(29, 30, 44, ${0.28 * gridAlpha})`;
      ctx.lineWidth = 1.2;
      for (let x = 120; x < W; x += 240) {
        for (let y = 120; y < H; y += 240) {
          ctx.beginPath();
          ctx.moveTo(x - 6, y);
          ctx.lineTo(x + 6, y);
          ctx.moveTo(x, y - 6);
          ctx.lineTo(x, y + 6);
          ctx.stroke();
        }
      }

      ctx.restore();

      ctx.save();
      ctx.translate(parallaxX * 0.35, parallaxY * 0.35);
      const frameMargin = 42;

      // Marco perimetral dibujándose mediante stroke-dashoffset (svg-animation skill)
      const borderDraw = interpolate(t, [0.05, 1.1], [0, 1], { easing: Easing.easeOutExpo });
      ctx.strokeStyle = 'rgba(29, 30, 44, 0.55)';
      ctx.lineWidth = 1.8;
      strokeDrawOnCanvas(ctx, (W + H) * 2, borderDraw, (c) => {
        c.beginPath();
        c.rect(frameMargin, frameMargin, W - frameMargin * 2, H - frameMargin * 2);
      });

      const cornerLen = 22;
      ctx.strokeStyle = PALETTE.charcoal;
      ctx.lineWidth = 3.5;
      const corners = [
        [frameMargin, frameMargin, 1, 1],
        [W - frameMargin, frameMargin, -1, 1],
        [frameMargin, H - frameMargin, 1, -1],
        [W - frameMargin, H - frameMargin, -1, -1]
      ];
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy + dy * cornerLen);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + dx * cornerLen, cy);
        ctx.stroke();
      });

      ctx.fillStyle = PALETTE.charcoal;
      ctx.font = '700 13px "JetBrains Mono", Consolas, monospace';
      ctx.fillText('ARCHIVO CIENTÍFICO // BLOQUE 0: COLD OPEN · BEAT 01 [00:00 - 00:11]', frameMargin + 16, frameMargin - 12);

      ctx.textAlign = 'right';
      ctx.fillStyle = PALETTE.cyanDeep;
      ctx.fillText('FIG. 01 — FLUJO SOLAR DE NEUTRINOS ELECTRÓNICOS (νₑ) · ESCALA 1:1', W - frameMargin - 16, frameMargin - 12);

      ctx.textAlign = 'left';
      ctx.strokeStyle = 'rgba(29, 30, 44, 0.45)';
      ctx.lineWidth = 1.2;
      for (let x = frameMargin + 40; x < W - frameMargin - 40; x += 20) {
        const isMajor = (x - frameMargin) % 100 === 0;
        const tickH = isMajor ? 10 : 5;
        ctx.beginPath();
        ctx.moveTo(x, H - frameMargin);
        ctx.lineTo(x, H - frameMargin - tickH);
        ctx.stroke();
      }

    function drawSolarStampCutout(ctx, t, parallaxX, parallaxY) {

      ctx.setLineDash([10, 6]);

    // =========================================================================
    // CAPA 2 & 4: HAZ DIAGONAL DE NEUTRINOS (CIAN ELÉCTRICO #00B4D8)
    // =========================================================================
    const BEAM_START = { x: 205, y: 245 };
    const THUMB_NAIL_CENTER = { x: 1155, y: 485 };
    const BEAM_END = { x: 2050, y: 702 };

    function drawNeutrinoBeamBackground(ctx, t, parallaxX, parallaxY) {
      const beamAppear = interpolate(t, [0.25, 1.4], [0, 1], { easing: Easing.easeOutCubic });
      if (beamAppear <= 0) return;

      ctx.save();
      ctx.translate(parallaxX, parallaxY);

      const dx = BEAM_END.x - BEAM_START.x;
      const dy = BEAM_END.y - BEAM_START.y;
      const angle = Math.atan2(dy, dx);
      const length = Math.hypot(dx, dy);

      ctx.translate(BEAM_START.x, BEAM_START.y);
      ctx.rotate(angle);

      const bandHalfWidth = 68;
      ctx.fillStyle = `rgba(0, 180, 216, ${0.085 * beamAppear})`;
      ctx.fillRect(0, -bandHalfWidth, length * beamAppear, bandHalfWidth * 2);

      ctx.fillStyle = `rgba(0, 180, 216, ${0.13 * beamAppear})`;
      ctx.fillRect(0, -bandHalfWidth * 0.52, length * beamAppear, bandHalfWidth * 1.04);

      ctx.strokeStyle = `rgba(0, 180, 216, ${0.48 * beamAppear})`;
      ctx.lineWidth = 1.6;
      ctx.setLineDash([12, 8]);
      ctx.lineDashOffset = -t * 140;

      const trackOffsets = [-64, -36, -12, 12, 36, 64];
      trackOffsets.forEach((off) => {
        ctx.beginPath();
        ctx.moveTo(0, off);
        ctx.lineTo(length * beamAppear, off);
        ctx.stroke();
      });

      ctx.setLineDash([]);
      for (let wIdx = -1; wIdx <= 1; wIdx += 2) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0, 180, 216, ${0.38 * beamAppear})`;
        ctx.lineWidth = 2.0;
        const baseOff = wIdx * 24;
        const maxDist = length * beamAppear;
        for (let s = 0; s <= maxDist; s += 8) {
          const env = Math.sin((s / 180) * Math.PI - t * 6) * 10;
          const wave = Math.sin(s * 0.085 - t * 22 + wIdx) * env;
          if (s === 0) ctx.moveTo(s, baseOff + wave);
          else ctx.lineTo(s, baseOff + wave);
        }
        ctx.stroke();
      }

      ctx.restore();

      // Cota técnica superior del haz con stroke-dashoffset draw-on (espejo de #svgDimensionLine)
      const dimDraw = interpolate(t, [0.6, 2.0], [0, 1], { easing: Easing.easeInOutCubic });
      if (dimDraw > 0) {
        ctx.save();
        ctx.translate(parallaxX, parallaxY);
        ctx.strokeStyle = 'rgba(29, 30, 44, 0.65)';
        ctx.lineWidth = 1.6;
        strokeDrawOnCanvas(ctx, 960, dimDraw, (c) => {
          c.beginPath();
          c.moveTo(515, 222);
          c.lineTo(1065, 362);
        }, [6, 6]);

        if (dimDraw > 0.45) {
          ctx.save();
          ctx.translate(785, 282);
          ctx.rotate(Math.atan2(362 - 222, 1065 - 515));
          ctx.fillStyle = PALETTE.creamCard;
          ctx.fillRect(-135, -18, 270, 22);
          ctx.strokeStyle = PALETTE.charcoal;
          ctx.lineWidth = 1.2;
          ctx.strokeRect(-135, -18, 270, 22);
          ctx.fillStyle = PALETTE.charcoal;
          ctx.font = '800 11px "JetBrains Mono", Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText('TRAYECTORIA RECTILÍNEA (v ≈ c)', 0, -3);
          ctx.restore();
        }
        ctx.restore();
      }
    }

    function drawNeutrinoParticlesForeground(ctx, t, parallaxX, parallaxY) {
      const beamAppear = interpolate(t, [0.3, 1.5], [0, 1], { easing: Easing.easeOutCubic });
      if (beamAppear <= 0) return;

      ctx.save();
      ctx.translate(parallaxX, parallaxY);

      const dx = BEAM_END.x - BEAM_START.x;
      const dy = BEAM_END.y - BEAM_START.y;
      const angle = Math.atan2(dy, dx);
      const length = Math.hypot(dx, dy);

      const nailDist = Math.hypot(THUMB_NAIL_CENTER.x - BEAM_START.x, THUMB_NAIL_CENTER.y - BEAM_START.y);

      ctx.translate(BEAM_START.x, BEAM_START.y);
      ctx.rotate(angle);

      const bandHalfWidth = 62;

      for (let i = 0; i < NEUTRINO_PARTICLES.length; i++) {
        const p = NEUTRINO_PARTICLES[i];
        const prog = (p.offsetPhase + t * p.speed) % 1.0;
        const s = prog * length;
        if (s > length * beamAppear) continue;

        const yOff = p.lateralSpread * bandHalfWidth;
        const distToNail = Math.abs(s - nailDist);
        const isCrossingNail = distToNail < 58 && Math.abs(yOff) < 48;
        const crossBoost = isCrossingNail ? (1 - distToNail / 58) : 0;

        if (p.type === 'wavepacket') {
          ctx.save();
          ctx.translate(s, yOff);
          ctx.strokeStyle = isCrossingNail ? PALETTE.stickerWhite : (p.amberAccent ? PALETTE.amber : PALETTE.cyan);
          ctx.lineWidth = isCrossingNail ? 2.8 : 2.0;
          ctx.beginPath();
          for (let wx = -22; wx <= 22; wx += 2) {
            const gauss = Math.exp(-(wx * wx) / 140);
            const wy = Math.sin(wx * 0.55 - t * 25) * 7.5 * gauss;
            if (wx === -22) ctx.moveTo(wx, wy);
            else ctx.lineTo(wx, wy);
          }
          ctx.stroke();

          ctx.fillStyle = isCrossingNail ? PALETTE.stickerWhite : PALETTE.cyan;
          ctx.beginPath();
          ctx.arc(0, 0, p.radius + crossBoost * 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          const r = p.radius * (1 + crossBoost * 0.65);

          ctx.strokeStyle = isCrossingNail
            ? 'rgba(253, 251, 247, 0.85)'
            : (p.amberAccent ? 'rgba(247, 127, 0, 0.45)' : 'rgba(0, 180, 216, 0.48)');
          ctx.lineWidth = r * 0.9;
          ctx.beginPath();
          ctx.moveTo(s - 18 - r * 2, yOff);
          ctx.lineTo(s, yOff);
          ctx.stroke();

          ctx.fillStyle = isCrossingNail
            ? PALETTE.stickerWhite
            : (p.amberAccent ? PALETTE.amber : PALETTE.cyan);
          ctx.beginPath();
          ctx.arc(s, yOff, r, 0, Math.PI * 2);
          ctx.fill();

          if (p.type === 'halftoneLarge' || isCrossingNail) {
            ctx.strokeStyle = isCrossingNail ? PALETTE.cyan : PALETTE.charcoal;
            ctx.lineWidth = 1.3;
            ctx.stroke();
          }
        }
      }

      for (let k = 0; k < 3; k++) {
        const pulseProg = ((t * 1.6 + k * 0.333) % 1.0);
        const ringR = 14 + pulseProg * 54;
        const alpha = (1 - pulseProg) * 0.75 * beamAppear;
        ctx.strokeStyle = k % 2 === 0
          ? `rgba(0, 180, 216, ${alpha})`
          : `rgba(253, 251, 247, ${alpha})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(nailDist, 0, ringR, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    // =========================================================================

    // =========================================================================
    function drawHandAndThumbCutout(ctx, t, parallaxX, parallaxY) {
      const enterProg = interpolate(t, [0.15, 1.05], [0, 1], { easing: Easing.easeOutCubic });

      ctx.bezierCurveTo(1310, 610, 1390, 585, 1485, 535);

      ctx.strokeStyle = 'rgba(29, 30, 44, 0.32)';

      for (let i = 0; i < 22; i++) {
        const y = 545 + i * 9;
        ctx.beginPath();
        ctx.moveTo(1092 + i * 3.2, y);
        ctx.quadraticCurveTo(1135 + i * 2.8, y + 6, 1168 + i * 2.5, y - 2);
        ctx.stroke();
      }
      ctx.restore();

      // 3. Trazos anatómicos en tinta carbón (#1D1E2C)
      traceHandSilhouette(ctx);
      ctx.lineWidth = 3.6;
      ctx.strokeStyle = PALETTE.charcoal;
      ctx.stroke();

      ctx.save();
      ctx.strokeStyle = PALETTE.charcoal;
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(1332, 585);

      // 4. UÑA DEL PULGAR (1155, 485)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(1112, 495);
      ctx.bezierCurveTo(1108, 458, 1126, 430, 1156, 428);
      ctx.bezierCurveTo(1186, 426, 1204, 454, 1200, 495);
      ctx.bezierCurveTo(1196, 520, 1178, 530, 1155, 530);
      ctx.bezierCurveTo(1132, 530, 1116, 518, 1112, 495);

      const nailGlow = 0.25 + 0.15 * Math.sin(t * 8.0);
      ctx.fillStyle = PALETTE.nailBed;
      ctx.fill();
      ctx.fillStyle = `rgba(0, 180, 216, ${nailGlow})`;

      ctx.fillStyle = PALETTE.stickerWhite;
      ctx.beginPath();
      ctx.moveTo(1122, 512);

      ctx.quadraticCurveTo(1175, 528, 1155, 528);

      ctx.beginPath();
      ctx.moveTo(1112, 495);
      ctx.bezierCurveTo(1108, 458, 1126, 430, 1156, 428);

      // 5. Retícula técnica sobre la uña con trazado progresivo SVG draw-on

        const rw = 116;

        ctx.strokeStyle = PALETTE.charcoal;
        ctx.lineWidth = 2.0;
        strokeDrawOnCanvas(ctx, 380, calloutDraw, (c) => {

        ctx.fillStyle = PALETTE.amber;
        ctx.beginPath();

        ctx.fill();

        if (calloutDraw > 0.35) {
          const cardAlpha = interpolate(calloutDraw, [0.35, 0.9], [0, 1]);
          ctx.save();
          ctx.globalAlpha = reticleAlpha * cardAlpha;
          ctx.fillStyle = PALETTE.charcoal;
          ctx.fillRect(88, -154, 268, 30);
          ctx.fillStyle = PALETTE.stickerWhite;
          ctx.font = '800 12.5px "JetBrains Mono", Consolas, monospace';
          ctx.fillText('ÁREA UÑA ≈ 1.5 cm² (BLANCO)', 98, -134);

          ctx.fillStyle = PALETTE.creamCard;
          ctx.fillRect(88, -116, 268, 26);
          ctx.strokeStyle = PALETTE.charcoal;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(88, -116, 268, 26);
          ctx.fillStyle = PALETTE.cyanDeep;
          ctx.font = '700 11.5px "JetBrains Mono", Consolas, monospace';
          ctx.fillText('ESPESOR: ~0.5 mm · QUERATINA α', 98, -99);

      // 6. Lupa Atómica en Collage (Secuencia Remotion t = 3.2s -> 11.0s)

        ctx.strokeStyle = 'rgba(29, 30, 44, 0.55)';
        ctx.lineWidth = 1.8;
        strokeDrawOnCanvas(ctx, 420, clamp(0, 1, loupeProg), (c) => {
          c.beginPath();
          c.moveTo(THUMB_NAIL_CENTER.x + 58, THUMB_NAIL_CENTER.y - 10);
          c.lineTo(lx - lr * 0.7, ly + lr * 0.65);
        }, [6, 6]);

        ctx.translate(lx, ly);
        ctx.scale(loupeProg, loupeProg);

        ctx.save();
        ctx.shadowColor = 'rgba(29, 30, 44, 0.25)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 8;
        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.beginPath();
        ctx.arc(0, 0, lr + 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, lr, 0, Math.PI * 2);
        ctx.fillStyle = PALETTE.charcoal;
        ctx.fill();
        ctx.clip();

        for (let gx = -60; gx <= 60; gx += 40) {
          for (let gy = -60; gy <= 60; gy += 40) {
            ctx.strokeStyle = 'rgba(244, 239, 230, 0.14)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(gx, gy, 15, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = PALETTE.amber;
            ctx.beginPath();
            ctx.arc(gx, gy, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.rotate(0.24);
        for (let tr = -65; tr <= 65; tr += 22) {
          ctx.strokeStyle = 'rgba(0, 180, 216, 0.55)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(-lr, tr);
          ctx.lineTo(lr, tr);
          ctx.stroke();

          const px = ((t * 220 + tr * 7) % (lr * 2)) - lr;
          ctx.fillStyle = PALETTE.stickerWhite;
          ctx.beginPath();
          ctx.arc(px, tr, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.strokeStyle = PALETTE.cyan;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, lr, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.strokeStyle = PALETTE.charcoal;
        ctx.lineWidth = 2;
        ctx.fillRect(-112, lr - 12, 224, 26);
        ctx.strokeRect(-112, lr - 12, 224, 26);
        ctx.fillStyle = PALETTE.charcoal;
        ctx.font = '800 11px "JetBrains Mono", Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ESCALA ATÓMICA: 99.9999999% VACÍO', 0, lr + 5);

        ctx.restore();
      }

      drawWashiTape(ctx, 1585, 885, 165, 36, -24, PALETTE.washiCream);
      drawWashiTape(ctx, 1345, 875, 140, 32, 18, PALETTE.washiAmber);

      ctx.restore();
    }

    // =========================================================================
    // CAPA 5: SECUENCIAS TIPOGRÁFICAS EDITORIALES (REMOTION SEQUENCES)
    // =========================================================================
    function drawEditorialTypography(ctx, t) {
      // Sequence 1 (from: 1.65s): Banner principal "100.000 MILLONES POR SEGUNDO"
      const bannerSeq = getSequenceProgress(t, 1.65, 0.7);
      if (bannerSeq > 0) {
        const bannerEase = Easing.easeOutBack(bannerSeq);
        ctx.save();
        const bx = 92;
        const by = 605;
        const offsetX = (1 - bannerEase) * -90;

        ctx.translate(bx + offsetX, by);
        ctx.globalAlpha = interpolate(t, [1.65, 1.95], [0, 1]);

        ctx.fillStyle = PALETTE.charcoal;
        ctx.fillRect(8, 8, 760, 146);

        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.fillRect(-5, -5, 770, 156);

        ctx.fillStyle = PALETTE.charcoal;
        ctx.fillRect(0, 0, 760, 146);

        ctx.fillStyle = PALETTE.cyan;
        ctx.fillRect(0, 0, 16, 146);

        const formattedCount = neutrinoCountSignal().toLocaleString('es-CO');

        ctx.fillStyle = PALETTE.cyanBright;
        ctx.font = '800 14px "JetBrains Mono", Consolas, monospace';
        ctx.fillText(
          `FLUJO SOLAR: ~6.5 × 10¹⁰ νₑ / cm²·s  [CONTADOR: ${formattedCount}.000.000 νₑ/s]`,
          34,
          30
        );

        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.font = '900 44px "Archivo Black", "Impact", "Arial Black", sans-serif';
        ctx.fillText('100.000 MILLONES', 32, 84);

        ctx.fillStyle = PALETTE.cyan;
        ctx.fillText('POR SEGUNDO', 32, 130);

        ctx.fillStyle = 'rgba(0, 180, 216, 0.14)';
        ctx.strokeStyle = PALETTE.cyan;
        ctx.lineWidth = 2;
        ctx.fillRect(545, 46, 192, 82);
        ctx.strokeRect(545, 46, 192, 82);

        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.font = '800 13px "JetBrains Mono", Consolas, monospace';
        ctx.fillText('PARTÍCULA:', 560, 70);
        ctx.fillStyle = PALETTE.cyanBright;
        ctx.font = '800 15px "JetBrains Mono", Consolas, monospace';
        ctx.fillText('NEUTRINO (νₑ)', 560, 92);
        ctx.fillStyle = PALETTE.amberBright;
        ctx.font = '700 12px "JetBrains Mono", Consolas, monospace';
        ctx.fillText('CARGA ELÉCTRICA: 0', 560, 114);

        ctx.restore();
      }

      // Sequence 2 (from: 7.20s): Sello de contraste "Y TÚ NO SIENTES ABSOLUTAMENTE NADA"
      const stampSeq = getSequenceProgress(t, 7.2, 0.48);
      if (stampSeq > 0) {
        const stampScale = interpolate(t, [7.2, 7.6], [1.22, 1.0], { easing: Easing.easeOutBack });

        ctx.save();
        const sx = 92;
        const sy = 782;
        ctx.translate(sx + 410, sy + 64);
        ctx.scale(stampScale, stampScale);
        ctx.rotate((-1.1 * Math.PI) / 180);
        ctx.translate(-410, -64);
        ctx.globalAlpha = interpolate(t, [7.2, 7.45], [0, 1]);

        const sw = 835;
        const sh = 128;

        ctx.fillStyle = PALETTE.charcoal;
        ctx.fillRect(10, 10, sw, sh);

        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.fillRect(-5, -5, sw + 10, sh + 10);

        ctx.fillStyle = PALETTE.amber;
        ctx.fillRect(0, 0, sw, sh);

        ctx.strokeStyle = PALETTE.charcoal;
        ctx.lineWidth = 3;
        ctx.strokeRect(6, 6, sw - 12, sh - 12);

        ctx.fillStyle = PALETTE.charcoal;
        ctx.fillRect(18, 16, sw - 36, 32);

        ctx.fillStyle = PALETTE.stickerWhite;
        ctx.font = '800 14px "JetBrains Mono", Consolas, monospace';
        ctx.fillText('MATERIA TRANSPARENTE — 0 COLISIONES  //  SECCIÓN EFICAZ: σ ≈ 10⁻⁴⁴ cm²', 30, 37);

        ctx.fillStyle = PALETTE.charcoal;
        ctx.font = '900 36px "Archivo Black", "Impact", "Arial Black", sans-serif';
        ctx.fillText('Y TÚ NO SIENTES ABSOLUTAMENTE NADA', 24, 98);

        drawWashiTape(ctx, sw - 25, 10, 95, 24, 22, PALETTE.washiCream);

        ctx.restore();
      }
    }

    // =========================================================================
    // SINCRONIZACIÓN DE LA CAPA INLINE <SVG> (SKILL: SVG-ANIMATION)
    // =========================================================================
    function syncInlineSvgLayer(t, camZoom, focusX, focusY, panX, panY) {
      if (!svgCameraGroup) return;
      const tx = focusX * (1 - camZoom) + panX * camZoom;
      const ty = focusY * (1 - camZoom) + panY * camZoom;
      svgCameraGroup.setAttribute('transform', `translate(${tx.toFixed(2)}, ${ty.toFixed(2)}) scale(${camZoom.toFixed(4)})`);

      const arcProg = interpolate(t, [0.35, 1.65], [0, 1], { easing: Easing.easeInOutCubic });
      if (svgSolarToThumbArc) {
        svgSolarToThumbArc.style.strokeDashoffset = (1 - arcProg).toFixed(4);
        svgSolarToThumbArc.style.opacity = interpolate(t, [0.35, 0.7], [0, 0.65]).toFixed(2);
      }
      const dimProg = interpolate(t, [0.6, 2.0], [0, 1], { easing: Easing.easeInOutCubic });
      if (svgDimensionLine) {
        svgDimensionLine.style.strokeDashoffset = (1 - dimProg).toFixed(4);
        svgDimensionLine.style.opacity = '0.45';
      }
      const ringProg = interpolate(t, [0.85, 2.2], [0, 1], { easing: Easing.easeOutExpo });
      if (svgThumbScanRing) {
        svgThumbScanRing.style.strokeDashoffset = (1 - ringProg).toFixed(4);
        svgThumbScanRing.style.opacity = '0.55';
      }
    }

    // =========================================================================
    // FUNCIÓN DETERMINISTA MAESTRA: renderFrame(ctx, timeInSeconds, width, height)
    // =========================================================================
    function renderFrame(ctx, timeInSeconds, width = W, height = H) {
      const t = clamp(0, DURATION, timeInSeconds);
      timeSignal(t);

      ctx.save();
      if (width !== W || height !== H) {
        ctx.scale(width / W, height / H);
      }

      // 1. Fondo de papel crema envejecido
      ctx.drawImage(paperCanvas, 0, 0);

      // 2. Cámara 2D estilo Motion Canvas (Camera.zoom & Camera.centerOn)
      const camZoom = cameraZoomSignal();
      const focusX = THUMB_NAIL_CENTER.x;
      const focusY = THUMB_NAIL_CENTER.y;

      const camProgress = Easing.easeInOutCubic(t / DURATION);
      const panX = map(0, -24, camProgress);
      const panY = map(0, -10, camProgress);

      ctx.save();
      ctx.translate(focusX, focusY);
      ctx.scale(camZoom, camZoom);
      ctx.translate(-focusX, -focusY);

      drawBlueprintGridAndMarks(ctx, t, panX * 0.35, panY * 0.35);
      drawSolarStampCutout(ctx, t, panX * 0.65, panY * 0.65);
      drawNeutrinoBeamBackground(ctx, t, panX * 0.9, panY * 0.9);
      drawHandAndThumbCutout(ctx, t, panX * 1.05, panY * 1.05);
      drawNeutrinoParticlesForeground(ctx, t, panX * 1.22, panY * 1.22);

      ctx.restore();

      // 3. Banners tipográficos y sellos editoriales
      drawEditorialTypography(ctx, t);

      // 4. Sincronizar overlay SVG vectorial
      syncInlineSvgLayer(t, camZoom, focusX, focusY, panX, panY);

      ctx.restore();
    }

    // =========================================================================
    // CONTROLES DE REPRODUCCIÓN, ?t=N SEEK HARNESS (SVG-ANIMATION) Y WEB AUDIO
    // =========================================================================
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scrubber = document.getElementById('scrubber');
    const timeReadout = document.getElementById('timeReadout');
    const voAudio = document.getElementById('voAudio');

    let isPlaying = false;
    let currentTime = 0;
    let lastRafTimestamp = null;
    let audioCtx = null;
    let humGain = null;

    function updateUI(t) {
      scrubber.value = t.toFixed(2);
      const f = String(Math.round(t * FPS)).padStart(3, '0');
      timeReadout.textContent = `${t.toFixed(2).padStart(5, '0')}s / ${DURATION.toFixed(2)}s [F:${f}]`;
    }

    window.renderFrame = renderFrame;
    window.seekTo = function(timeInSeconds) {
      isPlaying = false;
      currentTime = clamp(0, DURATION, timeInSeconds);
      renderFrame(ctx, currentTime, W, H);
      updateUI(currentTime);
    };

    function initSubatomicHum() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        const osc55 = audioCtx.createOscillator();
        const osc110 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        humGain = audioCtx.createGain();

        osc55.type = 'sine';
        osc55.frequency.value = 55;
        osc110.type = 'triangle';
        osc110.frequency.value = 110;

        filter.type = 'lowpass';
        filter.frequency.value = 160;

        humGain.gain.value = 0.0;

        osc55.connect(filter);
        osc110.connect(filter);
        filter.connect(humGain);
        humGain.connect(audioCtx.destination);

        osc55.start();
        osc110.start();
      } catch (e) {}
    }

    function updateHumGain(t, playing) {
      if (!audioCtx || !humGain) return;
      if (!playing || t >= DURATION) {
        humGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.06);
        return;
      }
      const fadeIn = clamp(0, 1, t / 0.5);
      const fadeOut = clamp(0, 1, (DURATION - t) / 0.6);
      const target = 0.045 * fadeIn * fadeOut;
      humGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.05);
    }

    function tick(timestamp) {
      if (!isPlaying) return;
      if (lastRafTimestamp === null) lastRafTimestamp = timestamp;
      const dt = (timestamp - lastRafTimestamp) / 1000;
      lastRafTimestamp = timestamp;

      if (!voAudio.paused && !voAudio.ended && voAudio.currentTime > 0 && voAudio.currentTime < 10.15) {
        currentTime = voAudio.currentTime;
      } else {
        currentTime += dt;
      }

      if (currentTime >= DURATION) {
        currentTime = DURATION;
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        voAudio.pause();
        updateHumGain(currentTime, false);
        renderFrame(ctx, currentTime, W, H);
        updateUI(currentTime);
        return;
      }

      updateHumGain(currentTime, true);
      renderFrame(ctx, currentTime, W, H);
      updateUI(currentTime);
      requestAnimationFrame(tick);
    }

    playBtn.addEventListener('click', () => {
      initSubatomicHum();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (isPlaying) {
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        voAudio.pause();
        updateHumGain(currentTime, false);
      } else {
        if (currentTime >= DURATION - 0.05) {
          currentTime = 0;
        }
        isPlaying = true;
        playBtn.textContent = '⏸ Pausa';
        lastRafTimestamp = null;
        if (currentTime < 10.2) {
          voAudio.currentTime = currentTime;
          voAudio.play().catch(() => {});
        }
        requestAnimationFrame(tick);
      }
    });

    restartBtn.addEventListener('click', () => {
      initSubatomicHum();
      currentTime = 0;
      voAudio.currentTime = 0;
      renderFrame(ctx, 0, W, H);
      updateUI(0);
      if (isPlaying) {
        lastRafTimestamp = null;
        voAudio.play().catch(() => {});
      }
    });

    scrubber.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      if (currentTime < 10.2) {
        try { voAudio.currentTime = currentTime; } catch (_) {}
      } else {
        voAudio.pause();
      }
      renderFrame(ctx, currentTime, W, H);
      updateUI(currentTime);
    });

    // Seek harness de svg-animation skill (?t=N congela el fotograma exacto para verificación)
    const paramT = urlParams.get('t');
    const initialT = paramT !== null ? parseFloat(paramT) : 0;
    window.seekTo(initialT);
    window.__ready = true;

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        renderFrame(ctx, currentTime, W, H);
        window.__ready = true;
      });
    }
  </script>
</body>
